<div class="scroll"><table><tr><th>When (UTC)</th><th>Client</th><th>Job</th><th>Trigger</th><th>Status</th><th>Result</th></tr>
{% for r in runs %}<tr><td>{{ r.started_at }}</td><td>{{ r.cname or r.client_id or 'system' }}</td><td>{{ r.job }}</td><td>{{ r.trigger }}</td>
<td><span class="badge {{ r.status }}">{{ r.status }}</span></td><td class="small">{{ r.error or r.stats or '' }}</td></tr>{% else %}<tr><td colspan="6" class="muted">No runs yet.</td></tr>{% endfor %}</table></div>
